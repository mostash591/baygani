<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>بایگانی اطلاعات | بانک اطلاعاتی طبقه‌بندی‌شده</title>
  <link rel="manifest" href="manifest.json">
<script>
(function(){try{var t=localStorage.getItem('baygan-theme');if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Vazirmatn',Tahoma,sans-serif;
  color-scheme:dark;
  --bg:#151117; --bg2:#211735; --surface:#291C4C; --elevated:#322167;
  --brand:#3D2980; --accent:#6B55BA; --hover:#7F65D0; --glow:#A18CE5;
  --ink:#F1EEFD; --ink2:#B8B1D8; --line:#4A397A;
  --ok:#22C55E; --warn:#F59E0B; --err:#EF4444;
  --sidebar:#211735; --sidebar2:#171126; --sidebar-edge:#4A397A;
  --veil:rgba(20,15,32,.94);
  --authgrad1:#322167; --authgrad2:#151117;
  --inpbg:#211735; --softbg:rgba(21,17,23,.35);
  --chipink:#D8CEFA; --brandglow:#A18CE5;
  --markbg:rgba(161,140,229,.3); --markink:#F1EEFD;
  --errbg:rgba(239,68,68,.14); --errink:#FCA5A5; --errline:rgba(239,68,68,.4);
  --warnbg:rgba(245,158,11,.14); --warnline:rgba(245,158,11,.4); --warnink:#FCD34D;
  --toastbg:#291C4C; --toastline:rgba(161,140,229,.28);
  --ringbg:rgba(107,85,186,.32); --glowshadow:rgba(107,85,186,.45);
  --shadow:0 12px 32px rgba(0,0,0,.45); --cardhover:0 14px 36px rgba(0,0,0,.55);
  --gridline:rgba(161,140,229,.05);
  --glow1:rgba(107,85,186,.16); --glow2:rgba(61,41,128,.24);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F7F6FB; --bg2:#EFEDF7; --surface:#FFFFFF; --elevated:#F0ECFF;
  --brand:#4C35A3; --accent:#4C35A3; --hover:#6652C7; --glow:#A18CE5;
  --ink:#171421; --ink2:#6B6780; --line:#E5E1EF;
  --ok:#16A34A; --warn:#D97706; --err:#DC2626;
  --sidebar:#211A35; --sidebar2:#181230; --sidebar-edge:#E8E4F2;
  --veil:rgba(26,18,48,.94);
  --authgrad1:#4C35A3; --authgrad2:#211A35;
  --inpbg:#FFFFFF; --softbg:#FAF9FE;
  --chipink:#4C35A3; --brandglow:#4C35A3;
  --markbg:#E6DEFF; --markink:#3B2A85;
  --errbg:#FDECEC; --errink:#B91C1C; --errline:#F3C1C1;
  --warnbg:#FEF3C7; --warnline:#F59E0B; --warnink:#92400E;
  --toastbg:#211A35; --toastline:rgba(161,140,229,.35);
  --ringbg:rgba(76,53,163,.18); --glowshadow:rgba(76,53,163,.32);
  --shadow:0 10px 30px rgba(23,20,33,.10); --cardhover:0 14px 32px rgba(76,53,163,.18);
  --gridline:rgba(76,53,163,.05);
  --glow1:rgba(76,53,163,.08); --glow2:rgba(161,140,229,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.8;overflow-x:hidden;
  background:
    radial-gradient(900px 480px at 92% -8%, var(--glow1), transparent 60%),
    radial-gradient(800px 520px at -8% 108%, var(--glow2), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 31px, var(--gridline) 31px 32px),
    repeating-linear-gradient(90deg, transparent 0 31px, var(--gridline) 31px 32px),
    var(--bg);
  transition:background .3s,color .3s;
}
[hidden]{display:none!important}
button{font-family:inherit}
svg{display:block;flex:none;width:16px;height:16px}
::selection{background:rgba(161,140,229,.35)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(107,85,186,.35);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
mark{background:var(--markbg);color:var(--markink);border-radius:4px;padding:0 2px}
.empty{color:var(--ink2);opacity:.6}
.hint{color:var(--ink2);font-size:12.5px}
.colgap{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid transparent;font:600 14px var(--font);cursor:pointer;transition:.18s;background:var(--elevated);color:var(--ink);white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--hover)}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--hover));color:#fff;box-shadow:0 6px 18px var(--glowshadow)}
.btn-accent:hover{background:var(--hover)}
.btn-danger{background:var(--err);color:#fff}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--elevated)}
.btn.big{padding:12px 20px;font-size:15px}
.btn.small{padding:5px 12px;font-size:12.5px;border-radius:9px}
.btn.active{background:var(--hover);color:#fff;border-color:var(--hover)}
.btn.recording{opacity:.55}
.iconbtn{width:34px;height:34px;border-radius:9px;border:none;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;transition:.15s}
.iconbtn:hover{background:rgba(127,101,208,.16)}
.iconbtn.warn:hover{background:rgba(239,68,68,.14);color:var(--err)}
.iconbtn svg,.btn svg,.tact svg{width:16px;height:16px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--inpbg);font:inherit;color:var(--ink);transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--hover);box-shadow:0 0 0 3px var(--ringbg);outline:none}
.inp::placeholder{color:var(--ink2);opacity:.7}
textarea.inp{resize:vertical;min-height:90px}
.flab{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center}
.flab svg{width:15px;height:15px;color:var(--brandglow)}
.ftag{font-size:11px;background:var(--elevated);border:1px solid var(--line);color:var(--chipink);padding:1px 8px;border-radius:99px;font-weight:600}
.checkrow{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.errbox{background:var(--errbg);border:1px solid var(--errline);color:var(--errink);padding:9px 12px;border-radius:10px;font-size:13px}
.warnbox{background:var(--warnbg);border:1px solid var(--warnline);color:var(--warnink);padding:12px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.warnbox svg{width:18px;height:18px;flex:none;margin-top:3px}
.linkbtn{background:none;border:none;color:var(--hover);font:600 13px var(--font);cursor:pointer;margin-top:16px;display:inline-flex;gap:6px;align-items:center}
.linkbtn:hover{text-decoration:underline}
.linkbtn svg{width:15px;height:15px}
.sbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;border-radius:99px;transition:.3s;background:var(--err)}
.sbar i.lv2{background:var(--warn)}
.sbar i.lv3,.sbar i.lv4{background:var(--ok)}
.pwbox .pwinp{position:relative}
.pwinp .inp{padding-inline-end:46px}
.pw-eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;border-radius:8px;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.pw-eye:hover{background:rgba(127,101,208,.16);color:var(--ink)}
.pw-eye svg{width:17px;height:17px}
.pwtools{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.pwbar{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px;max-width:150px}
.pwbar i{display:block;height:100%;width:0;background:var(--err);transition:.25s;border-radius:99px}
.pwbar i.lv2{background:var(--warn)}
.pwbar i.lv3,.pwbar i.lv4{background:var(--ok)}
.pwmask{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap}
.pvdots{font-size:15px;letter-spacing:2px;color:var(--ink);font-weight:700;background:var(--softbg);border:1px solid var(--line);border-radius:8px;padding:2px 10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urlval{display:inline-flex;align-items:center;gap:8px;max-width:100%;flex-wrap:wrap}
.urllink{color:var(--hover);text-decoration:none;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;max-width:100%;direction:ltr}
.urllink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urllink svg{width:14px;height:14px;color:var(--brandglow)}
.urllink:hover{text-decoration:underline;color:var(--glow)}
.mini svg{width:12px;height:12px;display:inline-block;vertical-align:-2px}
.audiowrap{display:flex;flex-direction:column;gap:6px;max-width:340px}
.audiowrap audio{width:100%;height:42px}
.fprev audio{width:100%;max-width:320px;height:42px;margin-top:8px;display:block}
.rtable audio{width:170px;height:36px}
.recstat{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--err);font-weight:700;flex-wrap:wrap}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--err);display:inline-block;animation:pulse 1.2s infinite}
/* ===== مبلغ ===== */
.moneybox{position:relative}
.moneybox .inp{padding-inline-end:76px}
.moneybox .moneyunit{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:800;color:var(--brandglow);background:var(--elevated);border:1px solid var(--line);padding:2px 9px;border-radius:8px;pointer-events:none;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moneyval{font-weight:800;font-size:14px}
.moneyval b{color:var(--brandglow);font-size:11px;background:var(--elevated);border:1px solid var(--line);padding:1px 9px;border-radius:99px;margin-inline-start:5px;font-weight:800}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr minmax(380px,520px);position:relative}
.theme-btn{position:absolute;top:18px;inset-inline-end:18px;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.09);color:#F1EEFD;display:grid;place-items:center;cursor:pointer;z-index:6;transition:.2s}
.theme-btn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.theme-btn svg{width:19px;height:19px}
.auth-side{background:linear-gradient(200deg,var(--authgrad1),var(--authgrad2) 75%);color:#EAE5FA;padding:52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side::before{content:'';position:absolute;inset:-40%;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%23A18CE5' stroke-opacity='.07'><rect x='16' y='16' width='40' height='40'/><rect x='16' y='16' width='40' height='40' transform='rotate(45 36 36)'/><circle cx='36' cy='36' r='3'/></g></svg>");animation:drift 90s linear infinite}
.auth-panel{position:relative;max-width:540px}
.auth-logo{display:flex;gap:12px;align-items:center;margin-bottom:34px}
.badge{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--glow));color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px var(--glowshadow)}
.badge svg{width:23px;height:23px}
.auth-logo .nm{font-weight:900;font-size:26px;line-height:1.2}
.auth-logo .sub{font-size:12px;opacity:.75}
.auth h1{font-size:46px;line-height:1.35;font-weight:900}
.auth h1 span{color:var(--glow)}
.auth-lead{opacity:.85;margin:10px 0 26px;font-size:15px}
.featlist{display:flex;flex-direction:column;gap:12px;list-style:none}
.featlist li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;opacity:.92}
.featlist svg{width:18px;height:18px;color:var(--glow);margin-top:4px}
.auth-legal{font-size:12px;opacity:.8;display:flex;gap:8px;align-items:center;font-weight:700}
.auth-legal svg{width:15px;height:15px}
.treeart{position:absolute;left:8%;bottom:6%;width:240px;height:auto;opacity:.55;animation:bob 6s ease-in-out infinite}
.auth-form{display:grid;place-items:center;padding:34px;background:var(--bg)}
.auth-card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--shadow);animation:fadeUp .4s}
.auth-step{display:inline-block;font-size:11.5px;font-weight:700;color:var(--brandglow);background:rgba(161,140,229,.14);border:1px solid rgba(161,140,229,.35);padding:3px 12px;border-radius:99px;margin-bottom:14px}
.auth-title{font-size:28px;font-weight:900;margin-bottom:6px}
.auth-sub{color:var(--ink2);font-size:13.5px;margin-bottom:20px}
#appRoot{display:grid;grid-template-columns:302px 1fr;height:100vh}
.sidebar{background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));color:#E9E4F8;display:flex;flex-direction:column;position:relative;z-index:5;border-inline-end:1px solid var(--sidebar-edge);overflow:hidden}
.sidebar::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%23A18CE5' stroke-opacity='.05'><rect x='16' y='16' width='40' height='40'/><rect x='16' y='16' width='40' height='40' transform='rotate(45 36 36)'/></g></svg>");pointer-events:none}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.09);position:relative;flex:none}
.side-head .badge{width:38px;height:38px;border-radius:11px}
.side-head .badge svg{width:21px;height:21px}
.brand-name{font-weight:900;font-size:19px;line-height:1.3}
.brand-sub{font-size:10.5px;opacity:.7}
.side-tools{padding:12px 14px;position:relative;flex:none}
.w100{width:100%;justify-content:center}
.tree{flex:1;overflow:auto;padding:4px 10px 14px;position:relative;min-height:0}
.tree-empty{padding:20px 10px;font-size:12.5px;opacity:.65;text-align:center}
.trow{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:.15s;user-select:none;position:relative}
.trow:hover{background:rgba(255,255,255,.07)}
.trow.sel{background:rgba(161,140,229,.18);box-shadow:inset 3px 0 0 var(--glow)}
.twist{width:18px;height:18px;border:none;background:none;color:#B8A8E8;display:grid;place-items:center;cursor:pointer}
.twist svg{width:13px;height:13px;transition:transform .2s;transform:rotate(90deg)}
.twist.open svg{transform:none}
.twist.ph{cursor:default}
.tico{color:rgba(233,228,248,.65)}
.tico svg{width:17px;height:17px}
.trow.sel .tico{color:var(--glow)}
.ttitle{flex:1;min-width:0;overflow-wrap:anywhere;white-space:normal;line-height:1.7;font-size:13.5px}
.tcount{font-size:10.5px;background:rgba(161,140,229,.28);color:#D8CCFA;border-radius:99px;padding:0 7px;font-weight:700;transition:.15s}
.trow:hover .tcount{opacity:0}
.tacts{position:absolute;inset-inline-end:4px;top:3px;bottom:3px;display:flex;gap:1px;align-items:center;opacity:0;transition:.15s;background:var(--veil);padding:0 3px;border-radius:8px}
.trow:hover .tacts{opacity:1}
.tact{width:22px;height:22px;border:none;background:transparent;color:#C9BCEF;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.tact:hover{background:rgba(255,255,255,.14);color:#fff}
.tact.warn:hover{color:#FFB4A8}
.tact svg{width:12.5px;height:12.5px}
.tkids{overflow:hidden}
.side-foot{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;opacity:.85;position:relative;flex:none}
.side-foot span{display:inline-flex;gap:5px;align-items:center}
.side-foot svg{width:13px;height:13px}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 2s infinite}
.side-clock{padding:12px 16px;border-top:1px solid rgba(255,255,255,.09);text-align:center;position:relative;flex:none}
.side-clock .time{font-size:24px;font-weight:900;letter-spacing:1px;color:#F1EEFD;line-height:1.2}
.side-clock .date{font-size:11.5px;color:#B8A8E8;opacity:.8;margin-top:2px}
.appmain{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden;font-size:13px;min-width:0}
.crumb{background:none;border:none;color:var(--ink2);font:600 13px var(--font);cursor:pointer;padding:4px 8px;border-radius:8px}
.crumb:hover{background:var(--elevated);color:var(--ink)}
.crumb.cur{color:var(--ink);font-weight:800;cursor:default;background:var(--elevated)}
.csep{color:var(--ink2);opacity:.6}
.top-actions{display:flex;gap:8px;align-items:center}
.save-ind{font-size:11px;color:var(--ok);opacity:0;transition:opacity .3s;display:inline-flex;gap:5px;align-items:center}
.save-ind.on{opacity:1}
.save-ind svg{width:13px;height:13px}
.theme-inline{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--elevated);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:.18s}
.theme-inline:hover{background:var(--hover);color:#fff;transform:translateY(-1px)}
.theme-inline svg{width:16px;height:16px}
#mainArea{flex:1;overflow:auto;padding:26px 30px 60px}
#menuBtn{display:none}
.node-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px;animation:fadeUp .3s}
.node-title{font-size:34px;font-weight:900;line-height:1.25}
.node-meta{color:var(--ink2);font-size:12.5px}
.node-actions{display:flex;gap:8px;flex-wrap:wrap}
.view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--elevated);padding:2px}
.view-toggle button{border:none;background:transparent;color:var(--ink2);padding:6px 10px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font:600 12px var(--font);border-radius:7px;transition:.15s}
.view-toggle button svg{width:14px;height:14px}
.view-toggle button.active{background:var(--hover);color:#fff}
.view-toggle button:hover:not(.active){color:var(--ink)}
.schema{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--elevated);border:1px solid var(--line);color:var(--chipink);padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600}
.chip svg{width:13px;height:13px}
.schema-empty{background:var(--elevated);border:1.5px dashed var(--hover);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.schema-empty p{font-size:13.5px}
.schema-empty svg{width:15px;height:15px;display:inline-block;vertical-align:-3px}
.rec-toolbar{display:flex;justify-content:flex-start;margin-bottom:14px}
.qfilter{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:0 12px;width:330px;max-width:100%}
.qfilter svg{width:16px;height:16px;color:var(--ink2)}
.qfilter .inp{border:none;box-shadow:none;padding:9px 0;background:transparent}
.qfilter .inp:focus{box-shadow:none}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px 12px;position:relative;transition:.2s;animation:fadeUp .4s both}
.rcard::before{content:'';position:absolute;top:14px;bottom:14px;right:0;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--glow))}
.rcard:hover{transform:translateY(-3px);box-shadow:var(--cardhover);border-color:var(--hover)}
.rcard.flash{animation:flash 1.5s}
.rcard-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faNum=n=>Number(n).toLocaleString('fa-IR');
const norm=s=>String(s==null?'':s).replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase().trim();
function uid(){let s='';crypto.getRandomValues(new Uint32Array(2)).forEach(x=>s+=x.toString(36));return s+Date.now().toString(36).slice(-4);}
function bufToB64(buf){const u8=new Uint8Array(buf);let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function b64ToBuf(b64){const s=atob(b64);const u8=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u8[i]=s.charCodeAt(i);return u8.buffer;}
function dataURLtoU8(dataURL){const i=dataURL.indexOf(',');const b64=dataURL.slice(i+1);const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);return u8;}
function b64ToBlob(dataURL,mime){const u8=dataURLtoU8(dataURL);return new Blob([u8],{type:mime||'application/octet-stream'});}
function readFileAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f);});}
function guessMime(file){if(file.type)return file.type;const n=(file.name||'').toLowerCase();if(n.endsWith('.docx'))return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';if(n.endsWith('.doc'))return 'application/msword';if(n.endsWith('.xlsx'))return 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';if(n.endsWith('.xls'))return 'application/vnd.ms-excel';if(n.endsWith('.pdf'))return 'application/pdf';if(n.endsWith('.mp3'))return 'audio/mpeg';if(n.endsWith('.wav'))return 'audio/wav';if(n.endsWith('.m4a'))return 'audio/mp4';if(n.endsWith('.ogg'))return 'audio/ogg';if(n.endsWith('.webm'))return 'audio/webm';return 'application/octet-stream';}
function fmtSize(b){if(b<1024)return faNum(b)+' بایت';if(b<1048576)return faNum(Math.round(b/1024))+' کیلوبایت';return faNum((b/1048576).toLocaleString(undefined,{maximumFractionDigits:1}))+' مگابایت';}
function faDate(iso){try{return new Date(iso+'T12:00:00').toLocaleDateString('fa-IR');}catch(e){return iso;}}
function fmtDT(ts){try{return new Date(ts).toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'});}catch(e){return '';}}

function copyText(txt){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('کپی شد')).catch(()=>fallbackCopy(txt));}else fallbackCopy(txt);}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('کپی شد');}catch(e){toast('کپی ممکن نشد','err');}ta.remove();}
function strength(p){let s=0;if(p.length>=6)s++;if(p.length>=10)s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9\u0600-\u06FF]/.test(p))s++;return s;}
function genPassword(){const sets=['ABCDEFGHJKLMNPQRSTUVWXYZ','abcdefghijkmnopqrstuvwxyz','23456789','!@#$%^&*-_=+'];const all=sets.join('');const arr=new Uint32Array(20);crypto.getRandomValues(arr);const out=[];sets.forEach((st,i)=>out.push(st[arr[i]%st.length]));for(let i=4;i<16;i++)out.push(all[arr[i]%all.length]);for(let i=out.length-1;i>0;i--){const j=arr[i]%(i+1);const t=out[i];out[i]=out[j];out[j]=t;}return out.join('');}

const LS_KEY='baygan-vault-v1';
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('baygan-db',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){const d=await idbOpen();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbDel(k){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function loadVaultLocal(){
 try{const v=await idbGet('vault');if(v)return v;}catch(e){}
 try{const s=localStorage.getItem(LS_KEY);if(s)return JSON.parse(s);}catch(e){}
 return null;
}
async function saveVaultLocal(payload){
 try{await idbSet('vault',payload);return;}catch(e){}
 try{localStorage.setItem(LS_KEY,JSON.stringify(payload));}catch(e2){throw new Error('حافظه مرورگر در دسترس نیست');}
}
async function deleteVaultLocal(){
 try{await idbDel('vault');}catch(e){}

}

async function deriveKey(pass,salt){

 return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:210000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}

let REC={stream:null,rec:null,timer:null,start:0,fid:null,btn:null};
function extFromMime(m){m=m||'';if(m.indexOf('ogg')>-1)return '.ogg';if(m.indexOf('mp4')>-1||m.indexOf('aac')>-1)return '.m4a';if(m.indexOf('mpeg')>-1||m.indexOf('mp3')>-1)return '.mp3';if(m.indexOf('wav')>-1)return '.wav';return '.webm';}
function abortRec(){
 if(REC.timer)clearInterval(REC.timer);
 if(REC.rec){try{REC.rec.onstop=null;REC.rec.stop();}catch(e){}}
 if(REC.stream){try{REC.stream.getTracks().forEach(t=>t.stop());}catch(e){}}
 if(REC.btn){REC.btn.disabled=false;REC.btn.classList.remove('recording');}
 const st=REC.fid?$('#rec_'+REC.fid):null;if(st)st.hidden=true;
 REC={stream:null,rec:null,timer:null,start:0,fid:null,btn:null};
}
async function startRec(fid,btn){
 if(REC.rec){toast('یک ضبط دیگر در جریان است','warn');return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('مرورگر شما از ضبط صدا پشتیبانی نمی‌کند؛ از «انتخاب فایل صدا» استفاده کنید','err');return;}
 try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   const mrec=new MediaRecorder(stream);
   const chunks=[];
   mrec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
   mrec.onstop=()=>{
     try{stream.getTracks().forEach(t=>t.stop());}catch(e){}
     if(REC.timer)clearInterval(REC.timer);
     const st=$('#rec_'+fid);if(st)st.hidden=true;
     if(btn){btn.disabled=false;btn.classList.remove('recording');}
     REC={stream:null,rec:null,timer:null,start:0,fid:null,btn:null};
     const blob=new Blob(chunks,{type:mrec.mimeType||'audio/webm'});
     if(!blob.size){toast('ضبط خالی بود','warn');return;}
     const reader=new FileReader();
     reader.onload=()=>{
       const obj={name:'ضبط-صدا-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+extFromMime(blob.type),mime:blob.type||'audio/webm',size:blob.size,data:reader.result};
       if(CURPENDING)CURPENDING[fid]=obj;
       const pz=$('#prev_'+fid);if(pz)pz.innerHTML=prevHTML(obj);
       toast('صدا ضبط شد؛ برای ثبت نهایی دکمه «ثبت رکورد» را بزنید');
     };
     reader.readAsDataURL(blob);
   };
   mrec.start();
   REC={stream:stream,rec:mrec,timer:null,start:Date.now(),fid:fid,btn:btn};
   btn.disabled=true;btn.classList.add('recording');
   const st=$('#rec_'+fid);
   if(st){st.hidden=false;const tEl=st.querySelector('.rectime');REC.timer=setInterval(()=>{const s=Math.floor((Date.now()-REC.start)/1000);if(tEl)tEl.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},500);}
 }catch(err){toast('دسترسی به میکروفن ممکن نشد؛ اجازه میکروفن را بدهید یا از «انتخاب فایل صدا» استفاده کنید','err');}
}

function updateClock(){
 const t=$('#clockTime'),d=$('#clockDate');if(!t||!d)return;
 const now=new Date();
 t.textContent=now.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 d.textContent=now.toLocaleDateString('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
setInterval(updateClock,1000);

  +'<div class="trow'+(ui.sel===n.id?' sel':'')+'" data-act="select" data-nid="'+n.id+'" style="padding-inline-start:'+(8+depth*14)+'px">'
  +(kids.length?'<button class="twist'+(open?' open':'')+'" data-act="twist" data-nid="'+n.id+'">'+I.chev+'</button>':'<span class="twist ph"></span>')

 if(f.type==='image'){
   return '<div class="imgwrap"><img class="rthumb" src="'+v.data+'" data-act="thumb" alt="" loading="lazy">'
    +'<div class="imgbtns">'
    +'<button class="mini ghost" data-act="lightboxbtn" data-nid="'+nid+'" data-rid="'+rid+'" data-fid="'+f.id+'">بزرگ‌نمایی</button>'

   return '<div class="audiowrap"><audio controls src="'+v.data+'" preload="metadata"></audio>'
    +'<div class="imgbtns"><span class="hint">'+esc(v.name)+' · '+fmtSize(v.size)+'</span>'

  +'<button class="btn btn-primary" type="submit">'+I.search+'جستجو</button>'

 $('#sform').onsubmit=e=>{e.preventDefault();runSearch();};
 const sq=$('#sq');if(sq)sq.focus();
}
function typeIn(ft,filter){if(filter==='all')return true;if(filter==='text')return ft==='text'||ft==='longtext';return ft===filter;}
function searchStr(v){return typeof v==='object'?(v&&v.name?String(v.name):''):String(v);}
function snipMark(text,q){
 const nt=norm(text);const i=nt.indexOf(q);
 if(i<0)return esc(text).slice(0,140);
 const s=Math.max(0,i-38),e=Math.min(nt.length,i+q.length+48);
 const parts=nt.substring(s,e).split(q);
 return (s>0?'…':'')+parts.map(esc).join('<mark>'+esc(q)+'</mark>')+(e<nt.length?'…':'');
}
function runSearch(){
 const qEl=$('#sq');if(!qEl)return;
 ui.search={q:qEl.value,match:$('#smatch').value,scope:$('#sscope').value,type:$('#stype').value,done:true};
 const q=norm(ui.search.q);
 const nodeIds=(ui.search.scope==='sub'&&ui.sel&&DB.nodes[ui.sel])?subtreeIds(ui.sel):Object.keys(DB.nodes);
 const res=[];
 nodeIds.forEach(nid=>{
   const n=DB.nodes[nid];if(!n)return;
   (DB.records[nid]||[]).forEach(r=>{
     n.fields.forEach(f=>{
       if(f.type==='password')return;
       if(!typeIn(f.type,ui.search.type))return;
       const v=r.values[f.id];
       if(v==null||v==='')return;
       const sval=norm(searchStr(v));
       if(!q){res.push({nid:nid,rid:r.id,fid:f.id,snip:esc(searchStr(v)).slice(0,140)});}
       else if(ui.search.match==='exact'?sval===q:sval.includes(q)){res.push({nid:nid,rid:r.id,fid:f.id,snip:snipMark(searchStr(v),q)});}
     });
   });
 });
 ui.results=res;
 renderMain();
}

     +'<div class="ssnip">'+(x.snip||'—')+'</div></div>';

function gotoRecord(nid,rid){
 let c=DB.nodes[nid];
 while(c){ui.expanded.add(c.id);c=c.parent?DB.nodes[c.parent]:null;}
 ui.sel=nid;ui.view='node';renderAll();
 setTimeout(()=>{const el=$('#rec-'+rid);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);}},90);
}

const LIBS={
 mammoth:{src:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',ok:()=>window.mammoth,p:null},
 xlsx:{src:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',ok:()=>window.XLSX,p:null}
};
function ensureLib(key){
 const L=LIBS[key];
 if(L.ok())return Promise.resolve(true);
 if(!L.p){
   L.p=new Promise(res=>{
     const s=document.createElement('script');
     s.src=L.src;
     const to=setTimeout(()=>res(false),20000);
     s.onload=()=>{clearTimeout(to);res(!!L.ok());};
     s.onerror=()=>{clearTimeout(to);res(false);};
     document.head.appendChild(s);
   }).then(r=>{L.p=null;return r;});
 }
 return L.p;
}

function writeViewer(win,html){
 if(!win||win.closed)return;
 try{win.document.open();win.document.write(html);win.document.close();}catch(e){toast('خطا در نمایش فایل','err');}
}
function fallbackViewer(win,v,msg){
 const body='<div class="vmsg"><div class="ic">📄</div><h3>'+esc(v.name)+'</h3><p>'+esc(msg)+'</p></div>';
 writeViewer(win,viewerShell(v.name,'فایل',body,{href:v.data,name:v.name,size:v.size}));
}
async function previewWord(v,win){
 writeViewer(win,viewerShell(v.name,'فایل Word','<div class="vmsg"><div class="ic">⏳</div><p>در حال آماده‌سازی پیش‌نمایش…</p></div>',null));
 const isDocx=/\.docx$/i.test(v.name)||(v.mime||'').indexOf('wordprocessingml')>-1;
 if(isDocx){
   const ok=await ensureLib('mammoth');
   if(ok&&window.mammoth){
     try{
       const u8=dataURLtoU8(v.data);
       const res=await window.mammoth.convertToHtml({arrayBuffer:u8.buffer});
       if(win.closed)return;
       writeViewer(win,viewerShell(v.name,'فایل Word','<article class="docx">'+(res.value||'<p>محتوایی ندارد.</p>')+'</article>',{href:v.data,name:v.name,size:v.size}));
       return;
     }catch(e){}
   }
 }
 if(!win.closed)fallbackViewer(win,v,'پیش‌نمایش این فایل ممکن نیست (آفلاین هستید یا فرمت قدیمی است). فایل را دانلود و با آفیس باز کنید.');
}
async function previewExcel(v,win){
 writeViewer(win,viewerShell(v.name,'فایل Excel','<div class="vmsg"><div class="ic">⏳</div><p>در حال آماده‌سازی پیش‌نمایش…</p></div>',null));
 const ok=await ensureLib('xlsx');
 if(ok&&window.XLSX){
   try{
     const u8=dataURLtoU8(v.data);
     const wb=window.XLSX.read(u8,{type:'array'});
     let body='<div class="sheets">';
     wb.SheetNames.forEach(nm=>{
       const ws=wb.Sheets[nm];let table='';
       try{table=window.XLSX.utils.sheet_to_html(ws,{header:'',footer:''});}catch(e){table='';}
       body+='<section class="sheet"><h3>📋 '+esc(nm)+'</h3>'+(table||'<p>خالی</p>')+'</section>';
     });
     body+='</div>';
     if(!win.closed)writeViewer(win,viewerShell(v.name,'فایل Excel',body,{href:v.data,name:v.name,size:v.size}));
     return;
   }catch(e){}
 }
 if(!win.closed)fallbackViewer(win,v,'پیش‌نمایش این فایل ممکن نشد (آفلاین هستید یا فایل خراب است). فایل را دانلود و با اکسل باز کنید.');
}
function openFilePage(v,type){
 if(!v||!v.data)return;
 if(type==='pdf'){
   const url=URL.createObjectURL(b64ToBlob(v.data,v.mime||'application/pdf'));
   const w=window.open(url,'_blank');
   if(!w)toast('مرورگر پنجره جدید را مسدود کرد','err');
   setTimeout(()=>URL.revokeObjectURL(url),300000);
   return;
 }
 const win=window.open('about:blank','_blank');
 if(!win){
   if(type==='image'){$('#lightbox').innerHTML='<img src="'+v.data+'">';$('#lightbox').classList.add('on');}
   else toast('مرورگر پنجره جدید را مسدود کرد','err');
   return;
 }
 if(type==='image'){
   writeViewer(win,viewerShell(v.name||'تصویر','تصویر','<img class="vimg" src="'+v.data+'" alt="">',{href:v.data,name:v.name||'image',size:v.size||0}));
   return;
 }
 if(type==='audio'){
   writeViewer(win,viewerShell(v.name||'صدا','صدا','<audio controls src="'+v.data+'" class="vaudio"></audio>',{href:v.data,name:v.name||'audio',size:v.size||0}));
   return;
 }
 if(type==='word'){previewWord(v,win);return;}
 if(type==='excel'){previewExcel(v,win);return;}
 fallbackViewer(win,v,'پیش‌نمایش برای این نوع فایل در دسترس نیست.');
}

function askPasswordForDelete(nTitle,subCnt,recCnt){
 return new Promise(resolve=>{
   const msg='<div class="warnbox">'+I.alert+'<div><b>این شاخه حاوی اطلاعات است!</b><br>'
    +esc(nTitle)+' شامل '+(subCnt>1?faNum(subCnt)+' شاخه و ':'')
    +faNum(recCnt)+' رکورد است. برای حذف باید <b>رمز عبور اصلی</b> را وارد کنید.</div></div>';
   openModal('تأیید حذف امن',msg
    +'<form id="pwDelForm" class="colgap" style="margin-top:14px">'
    +'<label class="flab">'+I.key+' رمز عبور اصلی برنامه</label>'
    +'<input class="inp" type="password" id="pwDelInp" placeholder="رمز عبور" autofocus required>'
    +'<div class="errbox" id="pwDelErr" hidden></div>'
    +'<div class="mactions"><button type="button" class="btn btn-ghost" id="pwDelCancel">انصراف</button><button class="btn btn-danger" type="submit">'+I.trash+' تأیید و حذف</button></div></form>');
   $('#pwDelForm').onsubmit=async e=>{
     e.preventDefault();
     const pw=$('#pwDelInp').value;
     try{
       const salt=b64ToBuf(VAULT.salt);
       const k=await deriveKey(pw,salt);
       await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(VAULT.iv)},k,b64ToBuf(VAULT.ct));
       closeModal();resolve(true);
     }catch(err){
       showErr($('#pwDelErr'),'رمز عبور نادرست است. لطفاً رمز اصلی برنامه را وارد کنید.');
     }
   };
   $('#pwDelCancel').onclick=()=>{closeModal();resolve(false);};
   setTimeout(()=>{const inp=$('#pwDelInp');if(inp)inp.focus();},80);
 });
}

function unitControl(f,i){
 const known=CURRENCIES.some(c=>c.label===f.unit);
 if(known){
   return '<select class="inp funit" data-i="'+i+'">'
    +CURRENCIES.map(c=>'<option value="'+esc(c.label)+'"'+(f.unit===c.label?' selected':'')+'>'+esc(c.label)+'</option>').join('')
    +'<option value="__custom__">واحد دلخواه…</option></select>';
 }
 return '<input class="inp funitcustom" data-i="'+i+'" placeholder="واحد پول، مثلاً سکه" value="'+esc(f.unit||'')+'">';
}
function openFieldEditor(nid){
 const node=DB.nodes[nid];
 let local=node.fields.map(f=>({id:f.id,type:f.type,label:f.label,unit:f.unit||''}));
 openModal('فیلدهای شاخه «'+esc(node.title)+'»','<div id="feBox"></div>',{wide:true});
 const box=$('#feBox');
 function draw(){
   box.innerHTML=(local.length?local.map((f,i)=>'<div class="frow">'
     +'<select class="inp ftype" data-i="'+i+'">'+Object.keys(FIELD_TYPES).map(k=>'<option value="'+k+'"'+(f.type===k?' selected':'')+'>'+FIELD_TYPES[k].label+'</option>').join('')+'</select>'
     +'<input class="inp fname" data-i="'+i+'" placeholder="عنوان فیلد" value="'+esc(f.label)+'">'
     +(f.type==='money'?unitControl(f,i):'<span class="funit-empty"></span>')
     +'<button class="iconbtn warn" data-fdel="'+i+'" title="حذف فیلد">'+I.trash+'</button></div>').join('')
     :'<p class="hint" style="margin-bottom:10px">فیلدی تعریف نشده است.</p>')
     +'<div class="mactions spread"><button class="btn btn-ghost" data-fadd>'+I.plus+' افزودن فیلد</button><button class="btn btn-ghost" data-fcopy>'+I.dup+' کپی از شاخه دیگر</button></div>'
     +'<div class="mactions"><button class="btn btn-ghost" data-act="closemodal">انصراف</button><button class="btn btn-primary" data-fsave>ذخیره فیلدها</button></div>';
 }
 box.addEventListener('click',e=>{
   const del=e.target.closest('[data-fdel]');
   if(del){local.splice(+del.dataset.fdel,1);draw();return;}
   if(e.target.closest('[data-fadd]')){local.push({id:uid(),type:'text',label:'',unit:''});draw();return;}
   if(e.target.closest('[data-fcopy]')){openCopyFieldsModal(nid);return;}
   if(e.target.closest('[data-fsave]')){
     local=local.filter(f=>f.label&&f.label.trim());
     node.fields=local;save();closeModal();renderAll();toast('فیلدها ذخیره شد');
   }
 });
 box.addEventListener('change',e=>{
   const s=e.target.closest('.ftype');
   if(s){const i=+s.dataset.i;local[i].type=s.value;if(s.value==='money'&&!local[i].unit)local[i].unit='تومان';draw();return;}
   const u=e.target.closest('.funit');
   if(u){const i=+u.dataset.i;if(u.value==='__custom__'){local[i].unit='';}else{local[i].unit=u.value;}draw();return;}
 });
 box.addEventListener('input',e=>{
   const s=e.target.closest('.fname');if(s){local[+s.dataset.i].label=s.value;return;}
   const uc=e.target.closest('.funitcustom');if(uc){local[+uc.dataset.i].unit=uc.value;return;}
 });
 draw();
}

function openRecordForm(nid,rid){
 const n=DB.nodes[nid];
 if(!n.fields.length){toast('ابتدا فیلدهای شاخه را تعریف کنید','warn');openFieldEditor(nid);return;}
 const rec=rid?getRec(nid,rid):null;
 CURPENDING={};
 let h='<form id="recForm" class="rform">';
 n.fields.forEach(f=>{
   const v=rec?rec.values[f.id]:null;
   h+='<div class="ff"><label class="flab">'+I[FIELD_TYPES[f.type].icon]+esc(f.label)+(f.type==='money'&&f.unit?' <span class="ftag">'+esc(f.unit)+'</span>':'')+' <span class="ftag">'+FIELD_TYPES[f.type].label+'</span></label>'+inputFor(f,v)+'</div>';
 });
 h+='<div class="mactions"><button type="button" class="btn btn-ghost" data-act="closemodal">انصراف</button><button class="btn btn-accent" type="submit">'+(rec?'ذخیره تغییرات':'ثبت رکورد')+'</button></div></form>';
 openModal(rec?'ویرایش رکورد':'رکورد جدید در «'+esc(n.title)+'»',h,{wide:true});
 $('#recForm').onsubmit=async e=>{
   e.preventDefault();
   const values={};
   n.fields.forEach(f=>{
     if(isFileType(f.type)){
       const p=CURPENDING[f.id];
       if(p===null){}
       else if(p){values[f.id]=p;}
       else if(rec&&rec.values[f.id]){values[f.id]=rec.values[f.id];}
     }else{
       const el=e.target['f_'+f.id];
       const val=el?el.value.trim():'';
       if(val!=='')values[f.id]=val;
     }
   });
   if(rec){rec.values=values;rec.updatedAt=Date.now();}
   else{(DB.records[nid]=DB.records[nid]||[]).push({id:uid(),values:values,createdAt:Date.now(),updatedAt:Date.now()});}
   await doSave();closeModal();renderAll();toast(rec?'رکورد ویرایش شد':'رکورد ثبت شد');
 };
}

async function handleImport(file){
 try{
   const p=JSON.parse(await file.text());
   if(!p||!p.salt||!p.iv||!p.ct)throw new Error(0);
   await saveVaultLocal(p);VAULT=p;DB=null;KEY=null;
   closeModal();renderAuth();
   toast('پشتیبان بارگذاری شد؛ رمز عبورِ آن را وارد کنید');
 }catch(e){toast('فایل پشتیبان معتبر نیست','err');}
}

function buildPrint(title,groups){
 let total=0;
 let h='<div class="pr-top"><div class="pr-brand">بایگانی اطلاعات</div><h1>'+esc(title)+'</h1><div class="pr-meta">'
  +new Date().toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'})+' — ساعت '+new Date().toLocaleTimeString('fa-IR')+'</div></div>';
 groups.forEach(g=>{
   if(!g.records.length)return;
   h+='<div class="pr-path">'+esc(g.path)+'</div>';
   g.records.forEach(r=>{
     total++;
     h+='<div class="pr-rec"><div class="pr-rt">'+esc(cardTitle(g.node,r))+'</div><table>'
      +g.node.fields.map(f=>{
        const v=r.values[f.id];let cell='—';
        if(f.type==='password'&&v!=null&&v!==''){cell='•••••••••• (به دلایل امنیتی چاپ نمی‌شود)';}
        else if(v!=null&&v!==''){
          if(typeof v==='object'){
            if(f.type==='image')cell='<img class="pr-img" src="'+v.data+'">';
            else cell='پیوست ('+FIELD_TYPES[f.type].label+'): '+esc(v.name);
          }
          else if(f.type==='date')cell=faDate(v);
          else if(f.type==='money')cell=fmtMoney(v)+' '+esc(f.unit||'');
          else cell=esc(String(v)).replace(/\n/g,'<br>');
        }
        return '<tr><td class="pr-k">'+esc(f.label)+(f.type==='money'&&f.unit?' ('+esc(f.unit)+')':'')+'</td><td>'+cell+'</td></tr>';
      }).join('')+'</table></div>';
   });
 });
 h+='<div class="pr-foot">تعداد رکوردها: '+faNum(total)+' · تولیدشده توسط «بایگانی اطلاعات»</div>';
 $('#printArea').innerHTML=h;
 window.print();
}

function renderAuth(){
 $('#appRoot').hidden=true;$('#authScreen').hidden=false;
 const box=$('#authBox');
 if(!VAULT){
   box.innerHTML=setupHTML();
   $('#suP1').addEventListener('input',e=>{const s=strength(e.target.value);const b=$('#suBar');b.style.width=(s*25)+'%';b.className='lv'+s;});
   $('#setupForm').addEventListener('submit',async e=>{
     e.preventDefault();
     const p1=$('#suP1').value,p2=$('#suP2').value,err=$('#suErr');
     if(p1.length<6){showErr(err,'رمز عبور باید حداقل ۶ نویسه باشد.');return;}
     if(p1!==p2){showErr(err,'تکرار رمز عبور یکسان نیست.');return;}
     try{
       SALT=crypto.getRandomValues(new Uint8Array(16));
       KEY=await deriveKey(p1,SALT);
       DB=emptyDB();
       if($('#suSample').checked)seedSample();
       await doSave();enterApp();toast('گاوصندوق ساخته شد؛ خوش آمدید');
     }catch(x){showErr(err,'خطا: '+x.message);}
   });
 }else{
   box.innerHTML=unlockHTML();
   $('#ulRestore').addEventListener('click',()=>$('#importFile').click());
   $('#unlockForm').addEventListener('submit',async e=>{
     e.preventDefault();
     const err=$('#ulErr');const f=getFails();
     if(f.until>Date.now()){showErr(err,'ورود موقتاً مسدود است؛ '+faNum(Math.ceil((f.until-Date.now())/1000))+' ثانیه دیگر تلاش کنید.');return;}
     const btn=e.target.querySelector('button');btn.disabled=true;
     try{
       SALT=b64ToBuf(VAULT.salt);
       const k=await deriveKey($('#ulP').value,SALT);
       const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(VAULT.iv)},k,b64ToBuf(VAULT.ct));
       const obj=JSON.parse(new TextDecoder().decode(pt));
       if(!obj||obj.v!==1)throw new Error('bad');
       KEY=k;DB=obj;
       localStorage.removeItem(FKEY);
       enterApp();toast('خوش آمدید');
     }catch(x){
       const nf=saveFail();
       if(nf.until>Date.now())showErr(err,'تلاش‌های زیاد ناموفق؛ '+faNum(Math.ceil((nf.until-Date.now())/1000))+' ثانیه صبر کنید.');
       else{const left=5-nf.n;showErr(err,'رمز عبور نادرست است.'+(left>0?' ('+faNum(left)+' تلاش باقی‌مانده)':''));}
     }
     btn.disabled=false;$('#ulP').value='';$('#ulP').focus();
   });
   setTimeout(()=>{const u=$('#ulP');if(u)u.focus();},60);
 }
 updateThemeIcons();setMetaTheme();
}

   case 'pickcopy':(async()=>{

   })();break;
   case 'opensearch':ui.view='search';renderAll();break;
